# A release: a tag vX.Y.Z on main publishes that version to PyPI and makes its GitHub
# release (AGENTS.md, *Releases*). The tag must match pyproject.toml's version, and the
# gate must pass on the tagged commit, before anything is published.
#
# PyPI takes the upload by trusted publishing (OpenID Connect): no token is stored here.
# PyPI's project names this repository, this workflow and the `pypi` environment.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'eman/microgrid'
    runs-on: ubuntu-latest
    steps:
      # Pinned by commit: a tag can be moved.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
      - run: uv python install 3.14
      - name: The tag is the version
        run: |
          version="$(uv version --short)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME, but pyproject.toml says $version" >&2
            exit 1
          fi
      - run: scripts/ci_local.sh
      - run: uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
        with:
          # Nothing to cache: with a cache, the action's post step fails on the cache
          # directory uv publish never makes, after the upload, and no release is made.
          enable-cache: false
      - run: uv publish --trusted-publishing always dist/*

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - name: The release, its notes the changelog's section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
